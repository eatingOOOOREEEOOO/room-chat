<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PrivateChat</title>
<style>
  :root {
    --blue: #007AFF;
    --blue-dark: #0051D5;
    --red: #FF3B30;
    --gray-bubble: #E9E9EB;
    --text: #000;
    --bg: #F2F2F7;
    --surface: rgba(255,255,255,0.75);
    --border: rgba(0,0,0,0.1);
    --input-bg: rgba(255,255,255,0.85);
    --muted: #8E8E93;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #fff; --bg: #000;
      --surface: rgba(28,28,30,0.85);
      --border: rgba(255,255,255,0.1);
      --input-bg: rgba(44,44,46,0.9);
      --muted: #636366;
      --gray-bubble: #3A3A3C;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; align-items: center; justify-content: center;
  }

  /* LOGIN */
  #login-screen {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem; background: var(--bg);
  }
  .login-card {
    width: 100%; max-width: 400px;
    background: var(--surface);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border-radius: 22px; border: 0.5px solid var(--border);
    padding: 2rem 1.75rem;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12), 0 1px 0 rgba(255,255,255,0.5) inset;
  }
  .login-icon { font-size: 44px; margin-bottom: 12px; display: block; }
  .login-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
  .login-sub { font-size: 14px; color: var(--muted); margin-bottom: 1.75rem; }
  .field-label { font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; margin-top: 16px; }
  .field-input {
    width: 100%; padding: 12px 14px;
    background: var(--input-bg);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 0.5px solid var(--border); border-radius: 12px;
    font-size: 16px; color: var(--text); outline: none;
    transition: border-color 0.2s, box-shadow 0.2s; -webkit-appearance: none;
  }
  .field-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,122,255,0.15); }
  .hint-box { margin-top: 14px; padding: 10px 13px; background: rgba(0,122,255,0.08); border-radius: 10px; font-size: 12.5px; color: var(--blue); line-height: 1.5; }
  #err-msg { font-size: 13px; color: var(--red); margin-top: 10px; min-height: 18px; }
  .join-btn {
    width: 100%; padding: 14px; margin-top: 1.25rem;
    background: var(--blue); color: #fff; border: none; border-radius: 14px;
    font-size: 16px; font-weight: 600; cursor: pointer; letter-spacing: -0.2px;
    transition: background 0.15s, transform 0.1s;
    box-shadow: 0 4px 16px rgba(0,122,255,0.35);
  }
  .join-btn:hover { background: var(--blue-dark); }
  .join-btn:active { transform: scale(0.98); }
  .join-btn:disabled { background: var(--muted); box-shadow: none; cursor: not-allowed; }

  /* CHAT */
  #chat-screen { display: none; width: 100%; height: 100%; flex-direction: column; position: relative; }
  @media (min-width: 768px) {
    #chat-screen { max-width: 760px; height: 100vh; margin: 0 auto; border-left: 0.5px solid var(--border); border-right: 0.5px solid var(--border); }
    body { background: #1C1C1E; }
  }

  #chat-header {
    flex-shrink: 0; padding: 0 16px;
    padding-top: var(--safe-top);
    height: calc(64px + var(--safe-top));
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface);
    backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
    border-bottom: 0.5px solid var(--border); position: relative; z-index: 10;
  }
  .header-center { display: flex; flex-direction: column; align-items: center; flex: 1; }
  .header-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, #007AFF, #5856D6);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 2px;
  }
  .header-name { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
  .header-status { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
  .status-dot.online { background: #34C759; }
  #leave-btn { font-size: 15px; color: var(--blue); background: none; border: none; cursor: pointer; padding: 4px 0; }
  .header-left, .header-right { width: 60px; }
  .header-right { display: flex; justify-content: flex-end; }

  /* Messages */
  #messages {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 12px 16px 8px;
    display: flex; flex-direction: column; gap: 3px;
    -webkit-overflow-scrolling: touch;
  }
  #messages::-webkit-scrollbar { display: none; }

  .msg { display: flex; flex-direction: column; max-width: 75%; position: relative; }
  .msg.me { align-self: flex-end; align-items: flex-end; }
  .msg.them { align-self: flex-start; align-items: flex-start; }
  .msg.system { align-self: center; align-items: center; margin: 6px 0; max-width: 100%; }
  .msg.retracted { opacity: 0.5; }

  .msg-bubble {
    padding: 9px 13px; font-size: 15px; line-height: 1.45;
    word-break: break-word; border-radius: 18px; position: relative;
    cursor: pointer; user-select: none;
    transition: transform 0.1s;
  }
  .msg-bubble:active { transform: scale(0.97); }
  .msg.me .msg-bubble { background: var(--blue); color: #fff; border-bottom-right-radius: 5px; }
  .msg.them .msg-bubble { background: var(--gray-bubble); color: var(--text); border-bottom-left-radius: 5px; }
  .msg.system .msg-bubble { background: none; font-size: 12px; color: var(--muted); padding: 2px 8px; }
  .msg.retracted .msg-bubble { font-style: italic; }
  .msg.me + .msg.me .msg-bubble { border-top-right-radius: 5px; }
  .msg.them + .msg.them .msg-bubble { border-top-left-radius: 5px; }

  .edited-tag { font-size: 10px; opacity: 0.65; margin-left: 4px; }

  .msg-time { font-size: 10px; color: var(--muted); margin-top: 3px; padding: 0 4px; }
  .msg-sender { font-size: 11px; color: var(--muted); padding: 0 4px; margin-bottom: 2px; }

  /* Context menu */
  .ctx-menu {
    position: fixed; z-index: 1000;
    background: var(--surface);
    backdrop-filter: blur(40px) saturate(200%); -webkit-backdrop-filter: blur(40px) saturate(200%);
    border: 0.5px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    overflow: hidden; min-width: 160px;
    animation: ctxIn 0.15s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes ctxIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .ctx-item {
    padding: 12px 16px; font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    transition: background 0.1s;
  }
  .ctx-item:hover { background: rgba(120,120,128,0.12); }
  .ctx-item + .ctx-item { border-top: 0.5px solid var(--border); }
  .ctx-item.danger { color: var(--red); }
  .ctx-icon { font-size: 16px; }

  /* Edit mode bar */
  #edit-bar {
    display: none; flex-shrink: 0;
    padding: 8px 16px; background: rgba(0,122,255,0.08);
    border-top: 0.5px solid rgba(0,122,255,0.2);
    font-size: 13px; color: var(--blue);
    align-items: center; justify-content: space-between;
  }
  #edit-bar.active { display: flex; }
  #cancel-edit { font-size: 13px; color: var(--red); background: none; border: none; cursor: pointer; font-weight: 500; }

  /* Typing */
  #typing-bar { height: 20px; padding: 0 20px; font-size: 12px; color: var(--muted); font-style: italic; flex-shrink: 0; }

  /* Input */
  #input-area {
    flex-shrink: 0; display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; padding-bottom: calc(10px + var(--safe-bottom));
    background: var(--surface);
    backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
    border-top: 0.5px solid var(--border);
  }
  #msg-input {
    flex: 1; min-height: 36px; max-height: 120px;
    padding: 8px 14px;
    background: var(--input-bg); border: 0.5px solid var(--border);
    border-radius: 20px; font-size: 15px; color: var(--text);
    outline: none; resize: none; overflow-y: auto;
    line-height: 1.4; font-family: inherit;
    transition: border-color 0.2s; -webkit-appearance: none;
  }
  #msg-input:focus { border-color: rgba(0,122,255,0.4); }
  #msg-input::placeholder { color: var(--muted); }
  #send-btn {
    width: 34px; height: 34px; flex-shrink: 0; border-radius: 50%;
    background: var(--blue); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.1s;
    box-shadow: 0 2px 8px rgba(0,122,255,0.3);
  }
  #send-btn:hover { background: var(--blue-dark); }
  #send-btn:active { transform: scale(0.93); }
  #send-btn svg { width: 15px; height: 15px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; margin-left: 1px; }
  #send-btn.edit-mode { background: #34C759; }

  /* Overlay */
  #ctx-overlay { display: none; position: fixed; inset: 0; z-index: 999; }

  @keyframes popIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .msg { animation: popIn 0.18s cubic-bezier(0.34,1.56,0.64,1); }
  .msg.system, .msg.no-anim { animation: none; }

  @media (min-width: 768px) {
    .msg { max-width: 60%; }
    #messages { padding: 16px 24px; }
    #input-area { padding: 12px 24px; }
    #msg-input { font-size: 14px; }
    .msg-bubble { font-size: 14px; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <span class="login-icon">💬</span>
    <div class="login-title">PrivateChat</div>
    <div class="login-sub">Chat terenkripsi &amp; private</div>
    <div class="field-label">Nama kamu</div>
    <input class="field-input" type="text" id="username" placeholder="mis. Ari" maxlength="20" autocomplete="off" autofocus>
    <div class="field-label">Kode Room</div>
    <input class="field-input" type="text" id="room-code" placeholder="mis. RAHASIA123" maxlength="30" autocomplete="off">
    <div class="hint-box">🔒 Bagikan kode room yang sama ke temanmu. Pesan dienkripsi sebelum dikirim.</div>
    <div id="err-msg"></div>
    <button class="join-btn" id="join-btn" onclick="joinRoom()">Masuk ke Room</button>
  </div>
</div>

<div id="chat-screen">
  <div id="chat-header">
    <div class="header-left"></div>
    <div class="header-center">
      <div class="header-avatar" id="header-avatar">?</div>
      <div class="header-name" id="header-name">Room</div>
      <div class="header-status">
        <span class="status-dot" id="partner-dot"></span>
        <span id="partner-status">Menunggu...</span>
      </div>
    </div>
    <div class="header-right"><button id="leave-btn" onclick="leaveRoom()">Keluar</button></div>
  </div>

  <div id="messages"></div>
  <div id="typing-bar"></div>
  <div id="edit-bar">
    <span>✏️ Mode edit pesan</span>
    <button id="cancel-edit" onclick="cancelEdit()">Batal</button>
  </div>
  <div id="input-area">
    <textarea id="msg-input" placeholder="iMessage" rows="1"></textarea>
    <button id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
</div>

<!-- Context menu -->
<div id="ctx-overlay" onclick="closeCtx()"></div>
<div id="ctx-menu" class="ctx-menu" style="display:none;"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, push, onChildAdded, onValue, set, update, remove, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyBa46N_EHA0KzquhgbL_U9uN2ZI33-NoeA",
  authDomain: "room-chat-386ac.firebaseapp.com",
  databaseURL: "https://room-chat-386ac-default-rtdb.firebaseio.com",
  projectId: "room-chat-386ac",
  storageBucket: "room-chat-386ac.firebasestorage.app",
  messagingSenderId: "786378115427",
  appId: "1:786378115427:web:e26839058864755a5f2b56"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let myName = '', myRoom = '', presenceRef = null, typingRef = null;
let typingTimer = null, partnerTypingTimer = null, historyKey = '';
let editingMsgId = null, editingEl = null;
let msgMap = {}; // msgId -> { el, data }

function xorEncrypt(text, key) {
  let r = '';
  for (let i = 0; i < text.length; i++) r += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  return btoa(unescape(encodeURIComponent(r)));
}
function xorDecrypt(enc, key) {
  try {
    const t = decodeURIComponent(escape(atob(enc)));
    let r = '';
    for (let i = 0; i < t.length; i++) r += String.fromCharCode(t.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    return r;
  } catch { return '[pesan tidak terbaca]'; }
}
function getTime() {
  return new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
}
function saveHistory(msgs) {
  try { localStorage.setItem(historyKey, JSON.stringify(msgs.slice(-200))); } catch {}
}
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(historyKey) || '[]'); } catch { return []; }
}

let lastSender = '';

function renderMessage(data, isMine, msgId, noAnim) {
  const msgs = document.getElementById('messages');
  const type = data.type === 'system' ? 'system' : isMine ? 'me' : 'them';

  // If already rendered, update it
  if (msgId && msgMap[msgId]) {
    updateMessageEl(msgMap[msgId].el, data, isMine);
    return;
  }

  const div = document.createElement('div');
  div.className = 'msg ' + type + (noAnim ? ' no-anim' : '');
  if (data.retracted) div.classList.add('retracted');
  if (msgId) div.dataset.id = msgId;

  if (type !== 'system' && !isMine) {
    const showSender = data.name !== lastSender;
    if (showSender) {
      const s = document.createElement('div'); s.className = 'msg-sender'; s.textContent = data.name; div.appendChild(s);
    }
    lastSender = data.name;
  }

  const b = document.createElement('div'); b.className = 'msg-bubble';
  b.textContent = data.retracted ? 'Pesan ditarik' : data.text;
  if (data.edited && !data.retracted) {
    const tag = document.createElement('span'); tag.className = 'edited-tag'; tag.textContent = '(diedit)'; b.appendChild(tag);
  }
  div.appendChild(b);

  if (type !== 'system') {
    const t = document.createElement('div'); t.className = 'msg-time'; t.textContent = data.time || ''; div.appendChild(t);
    if (isMine && msgId && !data.retracted) {
      b.addEventListener('click', (e) => { e.stopPropagation(); showCtx(e, msgId, div, data); });
      b.addEventListener('contextmenu', (e) => { e.preventDefault(); showCtx(e, msgId, div, data); });
      let holdTimer;
      b.addEventListener('touchstart', () => { holdTimer = setTimeout(() => showCtxTouch(msgId, div, data), 500); });
      b.addEventListener('touchend', () => clearTimeout(holdTimer));
      b.addEventListener('touchmove', () => clearTimeout(holdTimer));
    }
  }

  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  if (msgId) msgMap[msgId] = { el: div, data };
}

function updateMessageEl(el, data, isMine) {
  el.classList.toggle('retracted', !!data.retracted);
  const b = el.querySelector('.msg-bubble');
  if (!b) return;
  b.textContent = data.retracted ? 'Pesan ditarik' : data.text;
  if (data.edited && !data.retracted) {
    const tag = document.createElement('span'); tag.className = 'edited-tag'; tag.textContent = '(diedit)'; b.appendChild(tag);
  }
}

function sysMsg(text) { renderMessage({ type: 'system', text }, false, null, true); }

function updatePartner(online, name) {
  document.getElementById('partner-dot').classList.toggle('online', online);
  document.getElementById('partner-status').textContent = online ? name + ' online' : 'Menunggu...';
  if (online && name) {
    document.getElementById('header-avatar').textContent = name[0].toUpperCase();
    document.getElementById('header-name').textContent = name;
  }
}

// Context menu
function showCtx(e, msgId, el, data) {
  e.preventDefault();
  const menu = document.getElementById('ctx-menu');
  const overlay = document.getElementById('ctx-overlay');
  menu.innerHTML = '';

  const editItem = document.createElement('div'); editItem.className = 'ctx-item';
  editItem.innerHTML = 'Edit <span class="ctx-icon">✏️</span>';
  editItem.onclick = () => { closeCtx(); startEdit(msgId, el, data); };
  menu.appendChild(editItem);

  const retractItem = document.createElement('div'); retractItem.className = 'ctx-item danger';
  retractItem.innerHTML = 'Tarik Pesan <span class="ctx-icon">↩️</span>';
  retractItem.onclick = () => { closeCtx(); retractMessage(msgId); };
  menu.appendChild(retractItem);

  const x = Math.min(e.clientX || e.touches?.[0]?.clientX || 100, window.innerWidth - 180);
  const y = Math.min(e.clientY || e.touches?.[0]?.clientY || 100, window.innerHeight - 110);
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  menu.style.display = 'block';
  overlay.style.display = 'block';
}

function showCtxTouch(msgId, el, data) {
  const menu = document.getElementById('ctx-menu');
  const overlay = document.getElementById('ctx-overlay');
  menu.innerHTML = '';

  const editItem = document.createElement('div'); editItem.className = 'ctx-item';
  editItem.innerHTML = 'Edit <span class="ctx-icon">✏️</span>';
  editItem.onclick = () => { closeCtx(); startEdit(msgId, el, data); };
  menu.appendChild(editItem);

  const retractItem = document.createElement('div'); retractItem.className = 'ctx-item danger';
  retractItem.innerHTML = 'Tarik Pesan <span class="ctx-icon">↩️</span>';
  retractItem.onclick = () => { closeCtx(); retractMessage(msgId); };
  menu.appendChild(retractItem);

  menu.style.left = '50%';
  menu.style.top = '50%';
  menu.style.transform = 'translate(-50%, -50%)';
  menu.style.display = 'block';
  overlay.style.display = 'block';
}

window.closeCtx = function() {
  document.getElementById('ctx-menu').style.display = 'none';
  document.getElementById('ctx-menu').style.transform = '';
  document.getElementById('ctx-overlay').style.display = 'none';
};

function startEdit(msgId, el, data) {
  editingMsgId = msgId;
  editingEl = el;
  const input = document.getElementById('msg-input');
  input.value = data.text;
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  document.getElementById('edit-bar').classList.add('active');
  document.getElementById('send-btn').classList.add('edit-mode');
  input.focus();
}

window.cancelEdit = function() {
  editingMsgId = null; editingEl = null;
  document.getElementById('msg-input').value = '';
  document.getElementById('msg-input').style.height = 'auto';
  document.getElementById('edit-bar').classList.remove('active');
  document.getElementById('send-btn').classList.remove('edit-mode');
};

async function retractMessage(msgId) {
  const msgRef = ref(db, 'rooms/' + myRoom + '/messages/' + msgId);
  await update(msgRef, { retracted: true, enc: '' });
  // update local history
  const hist = loadHistory();
  const idx = hist.findIndex(h => h.id === msgId);
  if (idx >= 0) { hist[idx].retracted = true; hist[idx].text = 'Pesan ditarik'; saveHistory(hist); }
}

window.joinRoom = async function() {
  const nameVal = document.getElementById('username').value.trim();
  const roomVal = document.getElementById('room-code').value.trim().toUpperCase();
  const err = document.getElementById('err-msg');
  if (!nameVal) { err.textContent = 'Masukkan nama kamu.'; return; }
  if (!roomVal) { err.textContent = 'Masukkan kode room.'; return; }

  const btn = document.getElementById('join-btn');
  btn.disabled = true; btn.textContent = 'Menghubungkan...'; err.textContent = '';
  myName = nameVal; myRoom = roomVal;
  historyKey = 'privatechat_' + btoa(roomVal).replace(/[^a-zA-Z0-9]/g,'');

  try {
    const msgsRef = ref(db, 'rooms/' + roomVal + '/messages');
    let firstLoad = true;

    // Listen for new messages
    onChildAdded(msgsRef, (snap) => {
      if (firstLoad) return;
      const d = snap.val();
      const isMine = d.name === myName;
      if (isMine) return; // already rendered on send
      const text = d.retracted ? 'Pesan ditarik' : xorDecrypt(d.enc, roomVal);
      renderMessage({ ...d, text }, false, snap.key);
    });

    // Listen for updates (edit/retract)
    onValue(msgsRef, (snap) => {
      if (!snap.exists()) return;
      snap.forEach((child) => {
        const d = child.val();
        const msgId = child.key;
        if (msgMap[msgId]) {
          const isMine = d.name === myName;
          const text = d.retracted ? 'Pesan ditarik' : xorDecrypt(d.enc, roomVal);
          updateMessageEl(msgMap[msgId].el, { ...d, text }, isMine);
          if (d.retracted) msgMap[msgId].el.classList.add('retracted');
        }
      });
    });

    firstLoad = false;

    // Presence
    presenceRef = ref(db, 'rooms/' + roomVal + '/presence/' + myName);
    await set(presenceRef, { name: myName, online: true, ts: serverTimestamp() });
    onValue(ref(db, 'rooms/' + roomVal + '/presence'), (snap) => {
      const data = snap.val() || {};
      const others = Object.entries(data).filter(([k]) => k !== myName);
      if (others.length > 0) updatePartner(others[0][1].online === true, others[0][1].name || others[0][0]);
      else updatePartner(false, '');
    });

    // Typing
    typingRef = ref(db, 'rooms/' + roomVal + '/typing/' + myName);
    onValue(ref(db, 'rooms/' + roomVal + '/typing'), (snap) => {
      const d = snap.val() || {};
      const others = Object.entries(d).filter(([k, v]) => k !== myName && v === true);
      if (others.length > 0) {
        document.getElementById('typing-bar').textContent = others[0][0] + ' sedang mengetik...';
        clearTimeout(partnerTypingTimer);
        partnerTypingTimer = setTimeout(() => { document.getElementById('typing-bar').textContent = ''; }, 2500);
      } else {
        document.getElementById('typing-bar').textContent = '';
      }
    });

    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('chat-screen').style.display = 'flex';
    document.getElementById('header-avatar').textContent = myName[0].toUpperCase();
    document.getElementById('header-name').textContent = roomVal;

    const hist = loadHistory();
    if (hist.length > 0) {
      sysMsg('— riwayat pesan —');
      hist.slice(-30).forEach(h => renderMessage(h, h.mine, h.id, true));
      sysMsg('— sekarang —');
    } else {
      sysMsg('Room aman. Mulai percakapan!');
    }

    const input = document.getElementById('msg-input');
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); window.sendMessage(); return; }
      clearTimeout(typingTimer);
      set(typingRef, true);
      typingTimer = setTimeout(() => set(typingRef, false), 2000);
    });
    input.focus();

  } catch(e) {
    console.error(e);
    err.textContent = 'Gagal terhubung: ' + e.message;
    btn.disabled = false; btn.textContent = 'Masuk ke Room';
  }
};

window.sendMessage = async function() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; input.style.height = 'auto';
  if (typingRef) set(typingRef, false);

  if (editingMsgId) {
    // Save edit
    const enc = xorEncrypt(text, myRoom);
    const msgRef = ref(db, 'rooms/' + myRoom + '/messages/' + editingMsgId);
    await update(msgRef, { enc, edited: true });
    if (msgMap[editingMsgId]) updateMessageEl(msgMap[editingMsgId].el, { ...msgMap[editingMsgId].data, text, edited: true }, true);
    // update history
    const hist = loadHistory();
    const idx = hist.findIndex(h => h.id === editingMsgId);
    if (idx >= 0) { hist[idx].text = text; hist[idx].edited = true; saveHistory(hist); }
    cancelEdit();
    return;
  }

  const time = getTime();
  const enc = xorEncrypt(text, myRoom);
  const newRef = push(ref(db, 'rooms/' + myRoom + '/messages'), { name: myName, enc, time });
  const msgId = newRef.key;
  renderMessage({ name: myName, text, time }, true, msgId);
  // save to history with id
  const hist = loadHistory();
  hist.push({ id: msgId, name: myName, text, time, mine: true });
  saveHistory(hist);
};

window.leaveRoom = function() {
  if (presenceRef) set(presenceRef, { name: myName, online: false });
  if (typingRef) set(typingRef, false);
  document.getElementById('chat-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('messages').innerHTML = '';
  lastSender = ''; msgMap = {};
  cancelEdit();
  document.getElementById('join-btn').disabled = false;
  document.getElementById('join-btn').textContent = 'Masuk ke Room';
  myName = ''; myRoom = '';
};
</script>
